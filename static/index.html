<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ASF 점검 우선순위 도구</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.Default.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  #header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid #ddd; background: #fafafa;
  }
  #header h1 { font-size: 15px; margin: 0; }
  #header label { font-size: 13px; color: #444; }
  #app { display: flex; height: calc(100% - 45px); }
  #map { flex: 1; }
  #panel { width: 400px; overflow-y: auto; padding: 16px; border-left: 1px solid #ddd; font-size: 13px; }
  #panel h2 { font-size: 16px; margin: 0 0 8px; }
  #panel h3 { font-size: 13px; color: #555; margin: 16px 0 6px; }
  .grade-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; color: white; font-weight: bold; }
  .disclaimer { font-size: 11px; color: #888; margin-top: 4px; }
  table.farms { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.farms th, table.farms td { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eee; }
  .no-data { color: #888; font-style: italic; padding: 8px 0; }
  .legend-box {
    position: absolute; bottom: 20px; left: 20px; z-index: 1000;
    background: white; padding: 8px 12px; border: 1px solid #999; border-radius: 4px; font-size: 12px;
  }
  #limitInput { width: 50px; }
</style>
</head>
<body>
<div id="header">
  <h1>ASF 점검 우선순위 도구</h1>
  <label>기준일(as_of): <input type="date" id="asOfInput"></label>
  <span id="refreshStatus" style="margin-left:auto; font-size:12px; color:#666;">갱신 상태 확인 중...</span>
</div>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div id="panelDefault">
      <h2>전국 브리핑</h2>
      <p id="nationalBriefing">불러오는 중...</p>
    </div>
    <div id="panelCounty" style="display:none;">
      <h2 id="countyName"></h2>
      <p><span id="countyGradeBadge" class="grade-badge"></span> <span id="countyDays"></span></p>
      <p id="countyBriefing"></p>
      <div class="disclaimer" id="countyDisclaimer"></div>
      <h3>등급 근거</h3>
      <p id="countyBasis"></p>
      <h3>농장 점검 순서 <input type="number" id="limitInput" value="20" min="1" max="200"></h3>
      <div id="farmListArea"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/leaflet.markercluster.js"></script>
<script>
const GRADE_COLOR = { "평시": "#a5d6a7", "주의": "#f4b400", "심각": "#d33f3f" };
const FARM_DOT_COLOR = "#2b6cb0";
const RECENT_WINDOW_DAYS = 21; // 등급 판정과 동일 기준(app/constants.py) — 지도의 발생 원도 이 창을 벗어나면 안 보여준다

let map, geoJsonLayer, farmClusterLayer;
let allOutbreaks = [];
let outbreakLayer;
let gradesByCode = {};
let boundaryFeaturesByCode = {};
let selectedCode = null;
let selectedLayerRef = null;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function asOfParam() {
  return document.getElementById("asOfInput").value.replaceAll("-", "");
}

function styleForFeature(feature) {
  const code = feature.properties.code;
  const grade = (gradesByCode[code] && gradesByCode[code].grade) || "평시";
  const isSelected = code === selectedCode;
  return {
    fillColor: GRADE_COLOR[grade],
    color: isSelected ? "#222222" : "#888888",
    weight: isSelected ? 2.5 : 0.5,
    fillOpacity: 0.75,
  };
}

function initMap() {
  map = L.map("map").setView([36.4, 127.9], 7);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: "CARTO / OpenStreetMap",
  }).addTo(map);
  // 시군 색칠 레이어(overlayPane, z=400)가 나중에 로드되면 발생 원을 덮어버리는 문제가
  // 있었다 — 로드 순서와 무관하게 항상 위에 그려지도록 전용 pane을 둔다.
  map.createPane("outbreaksPane");
  map.getPane("outbreaksPane").style.zIndex = 450;
}

// app/geo_normalize.py::display_name과 동일한 두 가지 보정을 클라이언트에서도 적용한다
// (경계 GeoJSON의 name은 원본 그대로 두고, 툴팁 표시할 때만 보정 — 매칭 키는 안 건드림).
const PROVINCE_DISPLAY_SHORT = {
  "11": "서울", "21": "부산", "22": "대구", "23": "인천", "24": "광주",
  "25": "대전", "26": "울산", "29": "세종", "31": "경기", "32": "강원",
  "33": "충북", "34": "충남", "35": "전북", "36": "전남", "37": "경북",
  "38": "경남", "39": "제주",
};
let nameToCodeCount = {};

function displayName(code, rawName) {
  let name = rawName.replace(/^(.+시)(.+구)$/, "$1 $2");
  if ((nameToCodeCount[rawName] || 0) > 1) {
    const province = PROVINCE_DISPLAY_SHORT[code.slice(0, 2)];
    if (province) name = `${province} ${name}`;
  }
  return name;
}

function loadBoundaries() {
  return fetch("/boundaries").then(r => r.json()).then(geojson => {
    for (const f of geojson.features) {
      boundaryFeaturesByCode[f.properties.code] = f;
      nameToCodeCount[f.properties.name] = (nameToCodeCount[f.properties.name] || 0) + 1;
    }
    geoJsonLayer = L.geoJSON(geojson, {
      style: styleForFeature,
      onEachFeature: (feature, layer) => {
        layer.on("click", () => selectCounty(feature.properties.code));
        layer.bindTooltip(displayName(feature.properties.code, feature.properties.name));
        // setStyle()로 폴리곤이 다시 그려질 때(클릭 시 선택 스타일 갱신) 마우스아웃 이벤트가
        // 씹혀 툴팁이 안 닫힌 채 남는 경우가 있어, 명시적으로 한 번 더 닫아준다.
        layer.on("mouseout", () => layer.closeTooltip());
      },
    }).addTo(map);
  });
}

function parseYYYYMMDD(s) {
  return new Date(Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)));
}

function loadOutbreaks() {
  return fetch("/outbreaks").then(r => r.json()).then(rows => {
    allOutbreaks = rows;
    renderOutbreaks();
  });
}

function renderOutbreaks() {
  if (outbreakLayer) map.removeLayer(outbreakLayer);
  outbreakLayer = L.layerGroup();
  const asOfDate = parseYYYYMMDD(asOfParam());
  for (const row of allOutbreaks) {
    const diffDays = (asOfDate - parseYYYYMMDD(row.case_date)) / 86400000;
    if (diffDays < 0 || diffDays > RECENT_WINDOW_DAYS) continue; // 오래된/미래 발생은 지금 등급과 무관하니 표시 안 함
    L.circle([row.lat, row.lon], {
      radius: 10000, color: "#c0392b", weight: 2.5, opacity: 0.9,
      fill: true, fillOpacity: 0.06, pane: "outbreaksPane",
    }).bindTooltip(`${row.case_date} ${row.address}`).addTo(outbreakLayer);
    // 10km 원만으로는 정확한 발생 지점이 원 어디쯤인지 안 보여서, 중심에 작은 점을 찍는다.
    L.circleMarker([row.lat, row.lon], {
      radius: 4, color: "#c0392b", weight: 1, fill: true, fillColor: "#c0392b",
      fillOpacity: 1, pane: "outbreaksPane",
    }).bindTooltip(`${row.case_date} ${row.address}`).addTo(outbreakLayer);
  }
  outbreakLayer.addTo(map);
}

function clusterIconFn(cluster) {
  const count = cluster.getChildCount();
  const size = count < 10 ? 30 : count < 100 ? 38 : 46;
  const shade = count < 10 ? "#7fa8d9" : count < 100 ? "#2b6cb0" : "#173d63";
  return new L.DivIcon({
    html: `<div style="background:${shade};border-radius:50%;width:${size}px;height:${size}px;` +
          `display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;` +
          `font-size:12px;border:2px solid white;box-shadow:0 0 3px rgba(0,0,0,0.4);">${count}</div>`,
    className: "asf-farm-cluster",
    iconSize: new L.Point(size, size),
  });
}

function loadFarms() {
  farmClusterLayer = L.markerClusterGroup({ iconCreateFunction: clusterIconFn });
  fetch("/farms").then(r => r.json()).then(rows => {
    for (const row of rows) {
      const label = row.farm_name || "(농장명 미상)";
      L.circleMarker([row.lat, row.lon], {
        radius: 3, color: FARM_DOT_COLOR, fill: true, fillOpacity: 0.7,
      }).bindTooltip(`${row.sigun} ${label}`).addTo(farmClusterLayer);
    }
    map.addLayer(farmClusterLayer);
  });
}

function loadRefreshStatus() {
  fetch("/refresh_status").then(r => r.json()).then(data => {
    const el = document.getElementById("refreshStatus");
    if (!data.checked_at) {
      el.textContent = "마지막 갱신: 아직 없음";
      return;
    }
    const t = new Date(data.checked_at).toLocaleString("ko-KR");
    if (data.error) {
      el.textContent = `마지막 갱신 시도: ${t} (실패 — 기존 데이터로 동작 중: ${data.error})`;
      el.style.color = "#b45309";
    } else {
      el.textContent = `마지막 갱신: ${t}${data.added > 0 ? ` (신규 ${data.added}건 반영)` : ""}`;
      el.style.color = "#666";
    }
  });
}

function loadGrades() {
  const asOf = asOfParam();
  return fetch(`/pipeline/run?as_of=${asOf}`).then(r => r.json()).then(data => {
    gradesByCode = data.grades;
    if (geoJsonLayer) geoJsonLayer.eachLayer(layer => layer.setStyle(styleForFeature(layer.feature)));
    document.getElementById("nationalBriefing").textContent = data.briefing.text;
    return data;
  });
}

function setGradeBadge(grade) {
  const el = document.getElementById("countyGradeBadge");
  el.textContent = grade;
  el.style.background = GRADE_COLOR[grade];
}

function renderFarmList(status, farmsList) {
  const area = document.getElementById("farmListArea");
  if (status === "no_farm_data") {
    area.innerHTML = '<div class="no-data">농장 데이터 미확보</div>';
    return;
  }
  if (farmsList.length === 0) {
    area.innerHTML = '<div class="no-data">조건에 맞는 농장 없음 (최근 3주 내 10km 이내 발생 없음)</div>';
    return;
  }
  let html = '<table class="farms"><tr><th>농장명</th><th>거리</th><th>사육두수</th></tr>';
  for (const f of farmsList) {
    const head = f["사육두수"] === null ? "미상" : f["사육두수"].toLocaleString();
    html += `<tr><td>${f.farm_name || "(미상)"}</td><td>${f.distance_km}km</td><td>${head}</td></tr>`;
  }
  html += "</table>";
  area.innerHTML = html;
}

function selectCounty(code) {
  const prevSelected = selectedCode;
  selectedCode = code;
  if (geoJsonLayer) geoJsonLayer.eachLayer(l => {
    if (l.feature.properties.code === prevSelected || l.feature.properties.code === code) {
      l.setStyle(styleForFeature(l.feature));
    }
    // 선택 테두리가 이웃 폴리곤(특히 나중에 그려진 평시=초록)에 덮여 안 보이던 문제 —
    // 선택된 레이어를 같은 pane 안에서 맨 위로 올린다.
    if (l.feature.properties.code === code) l.bringToFront();
  });

  document.getElementById("panelDefault").style.display = "none";
  document.getElementById("panelCounty").style.display = "block";

  const asOf = asOfParam();
  const limit = document.getElementById("limitInput").value || 20;
  fetch(`/sigun/${code}?as_of=${asOf}&limit=${limit}`).then(r => r.json()).then(data => {
    document.getElementById("countyName").textContent = data.name;
    setGradeBadge(data.grade.grade);
    document.getElementById("countyDays").textContent =
      data.grade.days_since_last === null ? "(최근 3주 내 근거가 되는 발생 없음)" : `가장 가까운 최근 발생: ${data.grade.days_since_last}일 전`;
    document.getElementById("countyBriefing").textContent = data.briefing.text;
    document.getElementById("countyDisclaimer").textContent = data.briefing.disclaimer;

    if (data.nearest_case_basis) {
      const b = data.nearest_case_basis;
      document.getElementById("countyBasis").textContent =
        `가장 가까운 최근 발생: ${b.address} (이 시군 경계로부터 ${b.distance_km}km, ${b.days_since}일 전). ${b.note}`;
    } else {
      document.getElementById("countyBasis").textContent =
        "최근 3주 안에 이 시군 경계로부터 20km 이내에서 발생한 사례가 없습니다.";
    }

    renderFarmList(data.farm_status, data.farms);
  });
}

document.getElementById("asOfInput").addEventListener("change", () => {
  renderOutbreaks();
  loadGrades().then(() => {
    loadRefreshStatus();
    if (selectedCode) selectCounty(selectedCode);
  });
});
document.getElementById("limitInput").addEventListener("change", () => {
  if (selectedCode) selectCounty(selectedCode);
});

document.getElementById("asOfInput").value = todayStr();
initMap();
loadOutbreaks();
loadFarms();
loadBoundaries().then(() => loadGrades().then(loadRefreshStatus));
</script>
</body>
</html>

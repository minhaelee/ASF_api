<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ASF 관제 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.Default.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Malgun Gothic", sans-serif; background: #eef1f6; }
  #header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid #dde3ec; background: #ffffff;
  }
  #header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  #header label { font-size: 13px; color: #444; white-space: nowrap; }
  #kpiStrip { display: flex; gap: 6px; }
  .kpi-chip {
    display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 10px;
    border-radius: 14px; font-size: 12px; font-weight: 600; color: white; white-space: nowrap;
  }
  .kpi-chip b { font-size: 13px; }
  #app { display: flex; height: calc(100% - 47px); }
  #map { flex: 1; }
  /* 2026-08-26(4차) — 우측 패널이 세로로 너무 길다는 피드백으로 폭을 넓혀 카드를
     2열로 배치할 여유를 준다(지도가 좁아지는 건 감수해도 된다고 확인됨). */
  #panel { width: 680px; overflow-y: auto; padding: 12px; background: #eef1f6; font-size: 13px; }
  .two-col-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; align-items: start; }
  .two-col-grid .dash-card { margin-bottom: 0; }
  .span2 { grid-column: 1 / -1; }
  #panel h2 { font-size: 17px; margin: 0; }
  .grade-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; color: white; font-weight: bold; font-size: 12px; }
  .disclaimer { font-size: 11px; color: #888; margin-top: 6px; line-height: 1.5; }
  #nationalBriefing { line-height: 1.6; margin: 0; }
  table.farms { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.farms th, table.farms td { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eee; }
  table.farms th:first-child, table.farms .farm-rank { width: 28px; text-align: center; }
  table.farms .farm-rank { font-weight: 700; color: #2b6cb0; }
  .no-data { color: #888; font-style: italic; padding: 8px 0; }
  .legend-box {
    position: absolute; bottom: 20px; left: 20px; z-index: 1000;
    background: white; padding: 8px 12px; border: 1px solid #999; border-radius: 4px; font-size: 12px;
  }
  #limitInput { width: 50px; }
  #backToNational {
    display: inline-block; padding: 0; border: none; background: none;
    color: #2b6cb0; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  #backToNational:hover { text-decoration: underline; }
  .leaflet-interactive:focus { outline: none; }

  /* 카드형 우측 패널 (2026-08-26(3차) — 관제 대시보드 재구성) */
  .dash-card {
    background: white; border: 1px solid #dde3ec; border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
  }
  .dash-card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; font-size: 13px; font-weight: 600; color: #333;
    background: #f7f9fc; cursor: pointer; user-select: none;
  }
  .dash-card-header.static { cursor: default; }
  .dash-card-header .chev { font-size: 10px; color: #999; transition: transform 0.15s; }
  .dash-card.collapsed .chev { transform: rotate(-90deg); }
  .dash-card.collapsed .dash-card-body { display: none; }
  .dash-card-body { padding: 12px; }
  .count-badge {
    display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 10px;
    background: #e2e8f5; color: #445; font-size: 11px; font-weight: 700;
  }

  .county-header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .county-sub { margin: 0; font-size: 12px; color: #666; }

  /* 위험 지역 리스트 — 표 대신 클릭 가능한 카드 행, 패널이 넓어져 2열로 배치 */
  #riskListArea { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .risk-row {
    padding: 8px 10px; border: 1px solid #eef1f6; border-radius: 6px; cursor: pointer;
  }
  .risk-row:hover { background: #f4f7fc; border-color: #cdd8ec; }
  .risk-row-top { display: flex; align-items: center; gap: 8px; }
  .risk-row-top .risk-name { font-weight: 600; flex: 1; }
  .risk-row-top .risk-dist { font-size: 11px; color: #888; }
  .risk-row-sub { margin-top: 3px; font-size: 11px; color: #777; }

  /* 체크리스트 */
  #checklistArea ul { margin: 0; padding-left: 0; list-style: none; }
  #checklistArea li {
    padding: 6px 8px 6px 26px; margin-bottom: 4px; background: #fafbfd;
    border: 1px solid #e4e8ef; border-radius: 4px; position: relative; line-height: 1.5;
  }
  #checklistArea li::before { content: "\2610"; position: absolute; left: 8px; color: #2b6cb0; }
  #checklistArea .basis { display: block; margin-top: 2px; font-size: 11px; color: #888; }

  /* 등급 근거 — 문장 대신 훑어보기 쉬운 키-값 행 (2026-08-26(4차)) */
  .stat-row {
    display: flex; justify-content: space-between; gap: 10px; padding: 5px 0;
    border-bottom: 1px solid #f0f2f6; font-size: 12px;
  }
  .stat-row:last-of-type { border-bottom: none; }
  .stat-row .stat-label { color: #888; white-space: nowrap; }
  .stat-row .stat-value { font-weight: 600; color: #333; text-align: right; }
  .stat-note { margin-top: 8px; font-size: 11px; color: #999; line-height: 1.5; }

  /* 뉴스 — 줄글 대신 문장 단위 불릿 (2026-08-26(4차)) */
  #countyNewsArea ul.bullet-list { margin: 0 0 10px 0; padding-left: 0; list-style: none; }
  #countyNewsArea ul.bullet-list li {
    position: relative; padding: 4px 0 4px 16px; line-height: 1.5; font-size: 12.5px;
  }
  #countyNewsArea ul.bullet-list li::before { content: "•"; position: absolute; left: 2px; color: #b8c0cc; }
  #countyNewsArea .citations { display: flex; flex-direction: column; gap: 6px; }
  .news-card {
    display: block; padding: 7px 9px; background: #fafbfd; border: 1px solid #e4e8ef;
    border-radius: 6px; text-decoration: none; color: inherit;
  }
  .news-card:hover { border-color: #b8c6e0; background: #f4f7fc; }
  .news-domain {
    display: inline-block; margin-bottom: 3px; padding: 1px 6px; border-radius: 3px;
    background: #e2e8f5; color: #2b4a8a; font-size: 10px; font-weight: 700;
  }
  .news-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 12px; color: #2b6cb0; line-height: 1.4;
  }
  #fieldResponseArea .loading { color: #888; font-style: italic; padding: 4px 0; }

  .farm-list-controls { font-size: 12px; color: #555; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="header">
  <h1>ASF 관제 대시보드</h1>
  <div id="kpiStrip">
    <span class="kpi-chip" style="background:#d33f3f">심각 <b id="kpiCritical">0</b></span>
    <span class="kpi-chip" style="background:#f4b400">주의 <b id="kpiWarning">0</b></span>
    <span class="kpi-chip" style="background:#a5d6a7">평시 <b id="kpiNormal">0</b></span>
  </div>
  <label>기준일(as_of): <input type="date" id="asOfInput"></label>
  <span id="refreshStatus" style="margin-left:auto; font-size:12px; color:#666;">갱신 상태 확인 중...</span>
</div>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div id="panelDefault">
      <div class="dash-card">
        <div class="dash-card-header static"><span>전국 브리핑</span></div>
        <div class="dash-card-body"><p id="nationalBriefing">불러오는 중...</p></div>
      </div>
      <div class="dash-card">
        <div class="dash-card-header static"><span>위험 지역 (심각·주의)</span></div>
        <div class="dash-card-body"><div id="riskListArea"></div></div>
      </div>
    </div>
    <div id="panelCounty" style="display:none;">
      <div class="two-col-grid">
        <div class="dash-card">
          <div class="dash-card-header static"><button id="backToNational" type="button">← 전국 브리핑으로</button></div>
          <div class="dash-card-body">
            <div class="county-header-row">
              <h2 id="countyName"></h2>
              <span id="countyGradeBadge" class="grade-badge"></span>
            </div>
            <p id="countyDays" class="county-sub"></p>
          </div>
        </div>

        <div class="dash-card">
          <div class="dash-card-header static"><span>브리핑</span></div>
          <div class="dash-card-body">
            <p id="countyBriefing" style="margin:0;"></p>
            <div class="disclaimer" id="countyDisclaimer"></div>
          </div>
        </div>
      </div>

      <div class="dash-card" id="farmListCard">
        <div class="dash-card-header" onclick="toggleCard(this)">
          <span>🐷 점검 필요 농장 순위<span id="farmCountBadge" class="count-badge"></span></span>
          <span class="chev">▾</span>
        </div>
        <div class="dash-card-body">
          <div class="farm-list-controls">표시 개수 <input type="number" id="limitInput" value="20" min="1" max="200"></div>
          <div id="farmListArea"></div>
        </div>
      </div>

      <div id="fieldResponseArea" class="two-col-grid" style="display:none;">
        <div class="dash-card" id="checklistCard">
          <div class="dash-card-header" onclick="toggleCard(this)">
            <span>📋 현장 대응 체크리스트</span><span class="chev">▾</span>
          </div>
          <div class="dash-card-body"><div id="checklistArea"></div></div>
        </div>
        <div class="dash-card" id="newsCard">
          <div class="dash-card-header" onclick="toggleCard(this)">
            <span>📰 최근 관련 뉴스</span><span class="chev">▾</span>
          </div>
          <div class="dash-card-body"><div id="countyNewsArea"></div></div>
        </div>
        <div class="disclaimer span2" id="fieldResponseDisclaimer" style="margin: -2px 4px 0;"></div>
      </div>

      <div class="dash-card collapsed" id="basisCard">
        <div class="dash-card-header" onclick="toggleCard(this)">
          <span>등급 근거</span><span class="chev">▾</span>
        </div>
        <div class="dash-card-body"><div id="countyBasis"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/leaflet.markercluster.js"></script>
<script>
const GRADE_COLOR = { "평시": "#a5d6a7", "주의": "#f4b400", "심각": "#d33f3f" };
const FARM_DOT_COLOR = "#2b6cb0";
const RECENT_WINDOW_DAYS = 21; // 등급 판정과 동일 기준(app/constants.py) — 지도의 발생 원도 이 창을 벗어나면 안 보여준다

let map, geoJsonLayer, farmClusterLayer;
let allOutbreaks = [];
let outbreakLayer;
let gradesByCode = {};
let boundaryFeaturesByCode = {};
let selectedCode = null;
let selectedLayerRef = null;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function asOfParam() {
  return document.getElementById("asOfInput").value.replaceAll("-", "");
}

// 카드 헤더 클릭 시 접기/펼치기(관제 대시보드 카드 컴포넌트 공용 함수)
function toggleCard(headerEl) {
  headerEl.closest(".dash-card").classList.toggle("collapsed");
}

// 위험 지역 카드를 눌러 시군을 선택했을 때(지도를 직접 안 봐도) 그 시군이 어디인지
// 바로 보이도록 지도를 이동·확대한다(2026-08-26(5차) 피드백). 지도 클릭으로 선택한
// 경우도 같은 함수를 타므로 동작이 일관된다.
function focusMapOnCounty(code) {
  const feature = boundaryFeaturesByCode[code];
  if (!feature) return;
  const bounds = L.geoJSON(feature).getBounds();
  map.flyToBounds(bounds, { padding: [60, 60], maxZoom: 11, duration: 0.6 });
}

function styleForFeature(feature) {
  const code = feature.properties.code;
  const grade = (gradesByCode[code] && gradesByCode[code].grade) || "평시";
  const isSelected = code === selectedCode;
  return {
    fillColor: GRADE_COLOR[grade],
    color: isSelected ? "#222222" : "#888888",
    weight: isSelected ? 2.5 : 0.5,
    fillOpacity: 0.75,
  };
}

function initMap() {
  map = L.map("map").setView([36.4, 127.9], 7);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: "CARTO / OpenStreetMap",
  }).addTo(map);
  // 시군 색칠 레이어(overlayPane, z=400)가 나중에 로드되면 발생 원을 덮어버리는 문제가
  // 있었다 — 로드 순서와 무관하게 항상 위에 그려지도록 전용 pane을 둔다.
  map.createPane("outbreaksPane");
  map.getPane("outbreaksPane").style.zIndex = 450;
  // 농장 점(개별 circleMarker, 클러스터 풀렸을 때)도 overlayPane을 같이 쓰다 보니, 시군을
  // 선택해 그 폴리곤에 bringToFront()를 부르면 농장 점이 밑에 깔리는 문제가 있었다 —
  // 발생 원과 마찬가지로 전용 pane을 둬서 시군 선택 여부와 무관하게 항상 위에 오게 한다.
  map.createPane("farmsPane");
  map.getPane("farmsPane").style.zIndex = 440;
}

// app/geo_normalize.py::display_name과 동일한 두 가지 보정을 클라이언트에서도 적용한다
// (경계 GeoJSON의 name은 원본 그대로 두고, 툴팁 표시할 때만 보정 — 매칭 키는 안 건드림).
const PROVINCE_DISPLAY_SHORT = {
  "11": "서울", "21": "부산", "22": "대구", "23": "인천", "24": "광주",
  "25": "대전", "26": "울산", "29": "세종", "31": "경기", "32": "강원",
  "33": "충북", "34": "충남", "35": "전북", "36": "전남", "37": "경북",
  "38": "경남", "39": "제주",
};

function displayName(code, rawName) {
  let name = rawName.replace(/^(.+시)(.+구)$/, "$1 $2");
  const province = PROVINCE_DISPLAY_SHORT[code.slice(0, 2)];
  if (province) name = `${province} ${name}`;
  return name;
}

function loadBoundaries() {
  return fetch("/boundaries").then(r => r.json()).then(geojson => {
    for (const f of geojson.features) {
      boundaryFeaturesByCode[f.properties.code] = f;
    }
    geoJsonLayer = L.geoJSON(geojson, {
      style: styleForFeature,
      onEachFeature: (feature, layer) => {
        layer.on("click", () => selectCounty(feature.properties.code));
        layer.bindTooltip(displayName(feature.properties.code, feature.properties.name));
        // setStyle()로 폴리곤이 다시 그려질 때(클릭 시 선택 스타일 갱신) 마우스아웃 이벤트가
        // 씹혀 툴팁이 안 닫힌 채 남는 경우가 있어, 명시적으로 한 번 더 닫아준다.
        layer.on("mouseout", () => layer.closeTooltip());
      },
    }).addTo(map);
  });
}

function parseYYYYMMDD(s) {
  return new Date(Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)));
}

function loadOutbreaks() {
  return fetch("/outbreaks").then(r => r.json()).then(rows => {
    allOutbreaks = rows;
    renderOutbreaks();
  });
}

function renderOutbreaks() {
  if (outbreakLayer) map.removeLayer(outbreakLayer);
  outbreakLayer = L.layerGroup();
  const asOfDate = parseYYYYMMDD(asOfParam());
  for (const row of allOutbreaks) {
    const diffDays = (asOfDate - parseYYYYMMDD(row.case_date)) / 86400000;
    if (diffDays < 0 || diffDays > RECENT_WINDOW_DAYS) continue; // 오래된/미래 발생은 지금 등급과 무관하니 표시 안 함
    // interactive: false — 안 그러면 이 원이 클릭을 가로채서 원 안에 있는 시군
    // 폴리곤을 선택할 수 없는 문제가 있었다. 툴팁은 아래 중심점(작아서 방해 안 됨)에서
    // 그대로 제공하므로 원 자체는 시각적 표시로만 남긴다.
    L.circle([row.lat, row.lon], {
      radius: 10000, color: "#c0392b", weight: 2.5, opacity: 0.9,
      fill: true, fillOpacity: 0.06, pane: "outbreaksPane", interactive: false,
    }).addTo(outbreakLayer);
    // 10km 원만으로는 정확한 발생 지점이 원 어디쯤인지 안 보여서, 중심에 작은 점을 찍는다.
    L.circleMarker([row.lat, row.lon], {
      radius: 4, color: "#c0392b", weight: 1, fill: true, fillColor: "#c0392b",
      fillOpacity: 1, pane: "outbreaksPane",
    }).bindTooltip(`${row.case_date} ${row.address}`).addTo(outbreakLayer);
  }
  outbreakLayer.addTo(map);
}

function clusterIconFn(cluster) {
  const count = cluster.getChildCount();
  const size = count < 10 ? 30 : count < 100 ? 38 : 46;
  const shade = count < 10 ? "#7fa8d9" : count < 100 ? "#2b6cb0" : "#173d63";
  return new L.DivIcon({
    html: `<div style="background:${shade};border-radius:50%;width:${size}px;height:${size}px;` +
          `display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;` +
          `font-size:12px;border:2px solid white;box-shadow:0 0 3px rgba(0,0,0,0.4);">${count}</div>`,
    className: "asf-farm-cluster",
    iconSize: new L.Point(size, size),
  });
}

function loadFarms() {
  farmClusterLayer = L.markerClusterGroup({ iconCreateFunction: clusterIconFn });
  fetch("/farms").then(r => r.json()).then(rows => {
    for (const row of rows) {
      const label = row.farm_name || "(농장명 미상)";
      L.circleMarker([row.lat, row.lon], {
        radius: 3, color: FARM_DOT_COLOR, fill: true, fillOpacity: 0.7, pane: "farmsPane",
      }).bindTooltip(`${row.sigun} ${label}`).addTo(farmClusterLayer);
    }
    map.addLayer(farmClusterLayer);
  });
}

function loadRefreshStatus() {
  fetch("/refresh_status").then(r => r.json()).then(data => {
    const el = document.getElementById("refreshStatus");
    if (!data.checked_at) {
      el.textContent = "마지막 갱신: 아직 없음";
      return;
    }
    const t = new Date(data.checked_at).toLocaleString("ko-KR");
    if (data.error) {
      el.textContent = `마지막 갱신 시도: ${t} (실패 — 기존 데이터로 동작 중: ${data.error})`;
      el.style.color = "#b45309";
    } else {
      el.textContent = `마지막 갱신: ${t}${data.added > 0 ? ` (신규 ${data.added}건 반영)` : ""}`;
      el.style.color = "#666";
    }
  });
}

function renderKpiStrip(grades) {
  const counts = { "심각": 0, "주의": 0, "평시": 0 };
  for (const g of Object.values(grades)) counts[g.grade]++;
  document.getElementById("kpiCritical").textContent = counts["심각"];
  document.getElementById("kpiWarning").textContent = counts["주의"];
  document.getElementById("kpiNormal").textContent = counts["평시"];
}

function loadGrades() {
  const asOf = asOfParam();
  return fetch(`/pipeline/run?as_of=${asOf}`).then(r => r.json()).then(data => {
    gradesByCode = data.grades;
    if (geoJsonLayer) geoJsonLayer.eachLayer(layer => layer.setStyle(styleForFeature(layer.feature)));
    renderKpiStrip(data.grades);
    document.getElementById("nationalBriefing").textContent = data.briefing.text;
    renderRiskList(data.risk_list);
    return data;
  });
}

function setGradeBadge(grade) {
  const el = document.getElementById("countyGradeBadge");
  el.textContent = grade;
  el.style.background = GRADE_COLOR[grade];
}

function renderRiskList(riskList) {
  const area = document.getElementById("riskListArea");
  if (!riskList || riskList.length === 0) {
    area.innerHTML = '<div class="no-data">현재 심각·주의 등급 시군 없음</div>';
    return;
  }
  let html = "";
  for (const r of riskList) {
    const badge = `<span class="grade-badge" style="background:${GRADE_COLOR[r.grade]}">${r.grade}</span>`;
    const farmCount = r.farm_count > 0 ? `농장 ${r.farm_count}개` : "농장 미확보";
    const livestock = r.livestock_count === null
      ? "사육두수 결측"
      : `${r.livestock_count.toLocaleString()}두(${r.livestock_year})`;
    html += `<div class="risk-row" data-code="${r.code}">` +
      `<div class="risk-row-top">${badge}<span class="risk-name">${r.name}</span><span class="risk-dist">${r.nearest_distance_km}km</span></div>` +
      `<div class="risk-row-sub">최근 발생 ${r.recent_case_count}건 · ${farmCount} · ${livestock}</div></div>`;
  }
  area.innerHTML = html;
}

// 위험 지역 카드 클릭 시 해당 시군으로 드릴다운(이벤트 위임 — innerHTML로 다시 그려도
// #riskListArea 자체는 그대로라 리스너를 매번 다시 달 필요 없음)
document.getElementById("riskListArea").addEventListener("click", e => {
  const row = e.target.closest(".risk-row");
  if (row) selectCounty(row.dataset.code);
});

// 등급 근거를 한 문장이 아니라 훑어보기 쉬운 키-값 행으로 보여준다(2026-08-26(4차) 피드백).
function renderBasis(nearestCaseBasis) {
  const area = document.getElementById("countyBasis");
  if (!nearestCaseBasis) {
    area.innerHTML = '<div class="no-data">최근 3주 안에 이 시군 경계로부터 20km 이내에서 발생한 사례가 없습니다.</div>';
    return;
  }
  const b = nearestCaseBasis;
  area.innerHTML =
    `<div class="stat-row"><span class="stat-label">가장 가까운 최근 발생</span><span class="stat-value">${b.address}</span></div>` +
    `<div class="stat-row"><span class="stat-label">거리</span><span class="stat-value">${b.distance_km}km (시군 경계 기준)</span></div>` +
    `<div class="stat-row"><span class="stat-label">경과</span><span class="stat-value">${b.days_since}일 전</span></div>` +
    `<div class="stat-note">${b.note}</div>`;
}

function renderFarmList(status, farmsList) {
  const area = document.getElementById("farmListArea");
  const badge = document.getElementById("farmCountBadge");
  if (status === "no_farm_data") {
    badge.textContent = "";
    area.innerHTML = '<div class="no-data">농장 데이터 미확보</div>';
    return;
  }
  badge.textContent = farmsList.length;
  if (farmsList.length === 0) {
    area.innerHTML = '<div class="no-data">조건에 맞는 농장 없음 (최근 3주 내 10km 이내 발생 없음)</div>';
    return;
  }
  let html = '<table class="farms"><tr><th>순위</th><th>농장명</th><th>거리</th><th>사육두수</th></tr>';
  farmsList.forEach((f, i) => {
    const head = f["사육두수"] === null ? "미상" : f["사육두수"].toLocaleString();
    html += `<tr><td class="farm-rank">${i + 1}</td><td>${f.farm_name || "(미상)"}</td><td>${f.distance_km}km</td><td>${head}</td></tr>`;
  });
  html += "</table>";
  area.innerHTML = html;
}

function renderChecklist(text) {
  const area = document.getElementById("checklistArea");
  const items = text.split("\n").map(l => l.trim()).filter(l => l.startsWith("-"));
  if (items.length === 0) {
    area.innerHTML = `<div class="no-data">${text || "체크리스트를 불러오지 못했습니다."}</div>`;
    return;
  }
  let html = "<ul>";
  for (const line of items) {
    const body = line.replace(/^-+\s*/, "");
    const m = body.match(/^(.*?)(\(근거:.*\))\s*$/);
    if (m) {
      html += `<li>${m[1].trim()}<span class="basis">${m[2]}</span></li>`;
    } else {
      html += `<li>${body}</li>`;
    }
  }
  html += "</ul>";
  area.innerHTML = html;
}

function newsDomain(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, "");
  } catch (e) {
    return url;
  }
}

// web_search 툴을 쓴 응답의 output_text에는 "...입니다. ([domain.com](url))"처럼
// 인용이 마크다운 링크 형태로 문장 안에 그대로 섞여 나온다(실측 확인, 프롬프트로
// "마크다운 금지"를 지시해도 이 citation 표기는 안 없어짐) — 아래 .citations 카드로
// 이미 따로 보여주므로 본문 문장에서는 지저분한 원본 링크 텍스트를 제거한다.
function stripInlineCitations(text) {
  return text.replace(/\s*\(\[[^\]]+\]\([^)]+\)\)/g, "");
}

// 긴 줄글보다 문장 단위 불릿이 더 훑어보기 쉽다는 피드백(2026-08-26(4차))으로,
// 마침표/물음표/느낌표 뒤에서 문장을 잘라 목록으로 보여준다.
function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]+\s*/g);
  return (parts && parts.length > 0 ? parts : [text]).map(s => s.trim()).filter(Boolean);
}

function renderCountyNews(text, citations) {
  const area = document.getElementById("countyNewsArea");
  const sentences = splitSentences(stripInlineCitations(text));
  let html = "<ul class=\"bullet-list\">" + sentences.map(s => `<li>${s}</li>`).join("") + "</ul>";
  if (citations && citations.length > 0) {
    html += '<div class="citations">';
    for (const c of citations) {
      html += `<a class="news-card" href="${c.url}" target="_blank" rel="noopener">` +
        `<span class="news-domain">${newsDomain(c.url)}</span>` +
        `<span class="news-title">${c.title}</span></a>`;
    }
    html += "</div>";
  }
  area.innerHTML = html;
}

function loadFieldResponse(code, asOf) {
  const area = document.getElementById("fieldResponseArea");
  area.style.display = "grid"; // .two-col-grid — "block"으로 두면 인라인 스타일이 클래스의 grid를 덮어써 1열로 무너짐
  document.getElementById("checklistArea").innerHTML = '<div class="loading">체크리스트 생성 중... (최대 20초 정도 걸릴 수 있습니다)</div>';
  document.getElementById("countyNewsArea").innerHTML = '<div class="loading">뉴스 검색 중...</div>';
  document.getElementById("fieldResponseDisclaimer").textContent = "";

  fetch(`/sigun/${code}/field_response?as_of=${asOf}`).then(r => r.json()).then(data => {
    if (!data.applicable) {
      area.style.display = "none";
      return;
    }
    renderChecklist(data.checklist_text);
    renderCountyNews(data.news_text, data.news_citations);
    document.getElementById("fieldResponseDisclaimer").textContent = data.disclaimer;
  }).catch(() => {
    document.getElementById("checklistArea").innerHTML = '<div class="no-data">체크리스트를 불러오지 못했습니다.</div>';
    document.getElementById("countyNewsArea").innerHTML = '<div class="no-data">뉴스를 불러오지 못했습니다.</div>';
  });
}

// 시군을 바꿀 때마다 카드 펼침 상태를 기본값으로 되돌린다 — 점검 필요 농장 순위는
// 이 도구의 핵심 산출물이라 항상 펼침(2026-08-26(5차) 피드백으로 최상단 근처로 이동),
// 체크리스트/뉴스도 펼침, 등급 근거만 접힘(가장 부차적인 설명 정보).
function resetCardStates() {
  document.getElementById("farmListCard").classList.remove("collapsed");
  document.getElementById("checklistCard").classList.remove("collapsed");
  document.getElementById("newsCard").classList.remove("collapsed");
  document.getElementById("basisCard").classList.add("collapsed");
}

function selectCounty(code) {
  const prevSelected = selectedCode;
  selectedCode = code;
  if (geoJsonLayer) geoJsonLayer.eachLayer(l => {
    if (l.feature.properties.code === prevSelected || l.feature.properties.code === code) {
      l.setStyle(styleForFeature(l.feature));
    }
    // 선택 테두리가 이웃 폴리곤(특히 나중에 그려진 평시=초록)에 덮여 안 보이던 문제 —
    // 선택된 레이어를 같은 pane 안에서 맨 위로 올린다.
    if (l.feature.properties.code === code) l.bringToFront();
  });
  focusMapOnCounty(code);

  document.getElementById("panelDefault").style.display = "none";
  document.getElementById("panelCounty").style.display = "block";
  resetCardStates();

  const asOf = asOfParam();
  const limit = document.getElementById("limitInput").value || 20;

  // 등급은 전국 브리핑 로드 때 이미 gradesByCode에 있으므로, /sigun/{code} 응답을
  // 기다리지 않고 평시가 아니면 바로 체크리스트/뉴스 fetch를 동시에 시작한다
  // (web_search+RAG라 레이턴시가 커서, 순차로 하면 체감 대기시간이 그만큼 늘어난다).
  const grade = gradesByCode[code] && gradesByCode[code].grade;
  if (grade && grade !== "평시") {
    loadFieldResponse(code, asOf);
  } else {
    document.getElementById("fieldResponseArea").style.display = "none";
  }

  fetch(`/sigun/${code}?as_of=${asOf}&limit=${limit}`).then(r => r.json()).then(data => {
    document.getElementById("countyName").textContent = data.name;
    setGradeBadge(data.grade.grade);
    document.getElementById("countyDays").textContent =
      data.grade.days_since_last === null ? "최근 3주 내 근거가 되는 발생 없음" : `가장 가까운 최근 발생: ${data.grade.days_since_last}일 전`;
    document.getElementById("countyBriefing").textContent = data.briefing.text;
    document.getElementById("countyDisclaimer").textContent = data.briefing.disclaimer;

    renderBasis(data.nearest_case_basis);
    renderFarmList(data.farm_status, data.farms);
  });
}

function deselectCounty() {
  const prevSelected = selectedCode;
  selectedCode = null;
  if (geoJsonLayer && prevSelected) {
    geoJsonLayer.eachLayer(l => {
      if (l.feature.properties.code === prevSelected) l.setStyle(styleForFeature(l.feature));
    });
  }
  document.getElementById("panelCounty").style.display = "none";
  document.getElementById("panelDefault").style.display = "block";
}

document.getElementById("backToNational").addEventListener("click", deselectCounty);

document.getElementById("asOfInput").addEventListener("change", () => {
  renderOutbreaks();
  loadGrades().then(() => {
    loadRefreshStatus();
    if (selectedCode) selectCounty(selectedCode);
  });
});
document.getElementById("limitInput").addEventListener("change", () => {
  if (selectedCode) selectCounty(selectedCode);
});

document.getElementById("asOfInput").value = todayStr();
initMap();
loadOutbreaks();
loadFarms();
loadBoundaries().then(() => loadGrades().then(loadRefreshStatus));
</script>
</body>
</html>
